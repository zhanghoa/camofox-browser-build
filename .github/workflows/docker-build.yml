name: Build Camoufox for ARM64 (Native)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 请将此处的 ${{ github.repository }} 替换为你的目标镜像仓库名
  # 例如：zhanghoa/camofox-browser
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-arm64-native:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout official camofox-browser repository
        uses: actions/checkout@v4
        with:
          repository: jo-inc/camofox-browser
          path: camofox-browser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image using official Dockerfile.ci
        uses: docker/build-push-action@v6
        with:
          context: camofox-browser
          # 直接使用官方项目中的 Dockerfile.ci
          file: camofox-browser/Dockerfile.ci
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
