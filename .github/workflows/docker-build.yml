name: Build and Push camofox-browser Docker Image (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout official repository
      uses: actions/checkout@v4
      with:
        repository: jo-inc/camofox-browser
        path: camofox-browser

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Fetch Camoufox and yt-dlp (ARM64)
      working-directory: camofox-browser
      run: |
        make fetch ARCH=aarch64

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ARM64 image
      uses: docker/build-push-action@v6
      with:
        context: camofox-browser
        platforms: linux/arm64   # 只构建 ARM64
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
