name: Build and Push camofox-browser Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 替换为你的目标镜像名称，例如: your-username/camofox-browser
  IMAGE_NAME: your-username/camofox-browser

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout the official camofox-browser repository
      uses: actions/checkout@v4
      with:
        repository: jo-inc/camofox-browser # ⬅️ 关键：指定要克隆的官方仓库
        path: camofox-browser

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Fetch Camoufox and yt-dlp binaries
      working-directory: camofox-browser
      run: |
        # 使用官方 Makefile 下载必要的二进制文件
        make fetch ARCH=x86_64

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: camofox-browser # ⬅️ 将构建上下文指向包含 Dockerfile 的目录
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
