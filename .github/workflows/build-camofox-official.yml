name: Build Camofox for ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Camoufox binaries
        run: |
          # 1. 克隆官方仓库
          git clone https://github.com/jo-inc/camofox-browser camofox-src
          
          # 2. 执行 make fetch
          cd camofox-src && make fetch ARCH=aarch64
          
          # 3. 将生成的 dist 拷贝到项目根目录（构建上下文）
          cp -r camofox-src/dist .
          
          # 4. 确保 dist 目录可见
          ls -F dist/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
