name: Build Official Camofox for ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 例如: zhanghoa/camofox-official

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout official repository
        uses: actions/checkout@v4
        with:
          repository: jo-inc/camofox-browser
          path: camofox-browser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch Camoufox binaries (ARM64)
        working-directory: camofox-browser
        run: |
          # 下载并解压 ARM64 浏览器（在 x86 runner 上原生执行，无 QEMU 干扰）
          make fetch ARCH=aarch64

      - name: Prepare build context with pre-extracted files
        run: |
          # 创建构建上下文目录
          mkdir -p build-context
          # 复制整个 camofox-browser 目录（包含 dist/ 中的已解压文件）
          cp -r camofox-browser/* build-context/
          # 注意：make fetch 已经在 dist/ 下生成了 camoufox-aarch64 目录和 yt-dlp-aarch64 文件
          # 我们保留这些文件，Dockerfile 将直接复制它们

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile.arm64   # 使用自定义 Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
