name: Build Official Camofox for ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout your repository (to get Dockerfile.arm64)
        uses: actions/checkout@v4

      - name: Checkout official camofox-browser repository
        uses: actions/checkout@v4
        with:
          repository: jo-inc/camofox-browser
          path: camofox-browser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch Camoufox binaries (ARM64) - native extraction
        working-directory: camofox-browser
        run: |
          make fetch ARCH=aarch64

      - name: Prepare build context with pre-extracted files and custom Dockerfile
        run: |
          mkdir -p build-context
          cp -r camofox-browser/* build-context/
          # 将仓库根目录下的 Dockerfile.arm64 复制到构建上下文
          cp Dockerfile.arm64 build-context/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
